connector.name=hive
hive.metastore=thrift
hive.metastore.uri=thrift://nessie:9083

# --- NEW NATIVE S3 SETTINGS ---
# This replaces the old hive.s3.* settings
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.path-style-access=true
s3.region=us-east-1

# Standard Hive setting
hive.storage-format=AVRO