connector.name=iceberg
iceberg.catalog.type=nessie

# 1. Nessie Configuration (Using v2 API)
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.default-warehouse-dir=s3://icebergwarehouse/
iceberg.nessie-catalog.ref=main

# 2. Native S3 (MinIO)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.path-style-access=true

# MUST HAVE: Trino 479 requires a region for the S3 client initialization
s3.region=us-east-1